name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12 is the fastest provisioning path on all three runners.
          # The package still *supports* 3.9 (see the syntax gate below);
          # setup-python 3.9 downloads have been flaky/unavailable.
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify Python 3.9 syntax compatibility
        run: python scripts/check_py39_syntax.py
      - name: Train + benchmark (quality gate)
        run: |
          python -m eddi.cli --train --epochs 2 --max-tokens 200000
          python -m eddi.cli --bench
