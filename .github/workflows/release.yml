name: Build and Release Eddi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C++20 Core
        run: |
          mkdir -p dist
          g++ -O3 -std=c++20 -march=x86-64 src/eddi_core.cpp -o dist/eddi_core-linux-x86_64
          tar -czf dist/eddi-linux-x86_64.tar.gz -C dist eddi_core-linux-x86_64
      - name: Run Tests
        run: python3 -m unittest discover -s tests -v
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/eddi-linux-x86_64.tar.gz
